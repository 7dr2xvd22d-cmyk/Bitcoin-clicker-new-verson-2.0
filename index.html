<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad 3D Car Sim</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; }

        /* HUD */
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .stat { font-size: 24px; font-weight: bold; margin-bottom: 5px; }

        /* iPad Kontroller */
        .controls {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px;
            box-sizing: border-box; pointer-events: none;
        }
        .btn {
            width: 90px; height: 90px; background: rgba(255,255,255,0.2);
            border: 3px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 40px;
            pointer-events: auto; user-select: none;
            -webkit-user-select: none;
        }
        .btn:active { background: rgba(247, 147, 26, 0.6); transform: scale(0.9); }
        .steering { display: flex; gap: 20px; }
        .pedals { display: flex; gap: 20px; }

        /* Butikk */
        #shop {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px;
            display: none; color: white; border: 2px solid #f7931a;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">BANK: $<span id="money">500</span></div>
        <div class="stat">FART: <span id="speed">0</span> KM/H</div>
        <div class="stat" id="wanted" style="color: red;"></div>
    </div>

    <div id="shop">
        <h2>BILBUTIKK & GARASJE</h2>
        <p>Oppgrader motor (+20 km/h): $200</p>
        <button onclick="buyUpgrade()" style="padding: 10px 20px; cursor: pointer;">KJØP MOTOR</button>
        <button onclick="toggleShop()" style="padding: 10px 20px; margin-left: 10px;">LUKK</button>
    </div>

    <div class="controls">
        <div class="steering">
            <div class="btn" id="btn-left">←</div>
            <div class="btn" id="btn-right">→</div>
        </div>
        <div class="btn" style="position: fixed; top: 20px; right: 20px; font-size: 20px;" onclick="toggleShop()">SHOP</div>
        <div class="pedals">
            <div class="btn" id="btn-rev">B</div>
            <div class="btn" id="btn-gas">G</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // --- CONFIG & VARIABLER ---
        let money = 500;
        let maxSpeed = 30; // m/s (ca 108 km/h)
        let accel = 0, steer = 0;
        
        // Scene oppsett
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Himmelblå
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Fysikk verden
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // --- BAKKEN (OPEN WORLD) ---
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);

        // --- BILEN ---
        const carBox = new THREE.BoxGeometry(2, 1, 4);
        const carMat = new THREE.MeshStandardMaterial({ color: 0xf7931a });
        const carMesh = new THREE.Mesh(carBox, carMat);
        scene.add(carMesh);

        const carBody = new CANNON.Body({ 
            mass: 1500, 
            shape: new CANNON.Box(new CANNON.Vec3(1, 0.5, 2)) 
        });
        carBody.position.set(0, 2, 0);
        world.addBody(carBody);

        // Lys
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- TOUCH INPUT LOGIKK ---
        const setupBtn = (id, onDown, onUp) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
        };

        setupBtn('btn-gas', () => accel = 1, () => accel = 0);
        setupBtn('btn-rev', () => accel = -1, () => accel = 0);
        setupBtn('btn-left', () => steer = 1, () => steer = 0);
        setupBtn('btn-right', () => steer = -1, () => steer = 0);

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);

            // Bilbevegelse
            if (Math.abs(accel) > 0) {
                const forward = new CANNON.Vec3(0, 0, accel * 5000);
                const rotatedForward = carBody.quaternion.vmult(forward);
                carBody.applyForce(rotatedForward, carBody.position);
            }

            // Svinging
            carBody.angularVelocity.y = steer * (carBody.velocity.length() * 0.1);

            // Oppdater grafikk
            carMesh.position.copy(carBody.position);
            carMesh.quaternion.copy(carBody.quaternion);

            // Kamera følger bil (Third person)
            const offset = new THREE.Vector3(0, 5, 10).applyQuaternion(carMesh.quaternion);
            camera.position.copy(carMesh.position).add(offset);
            camera.lookAt(carMesh.position);

            // UI
            const speedKmh = Math.round(carBody.velocity.length() * 3.6);
            document.getElementById('speed').innerText = speedKmh;
            
            renderer.render(scene, camera);
        }

        // --- SHOP FUNKSJONER ---
        function toggleShop() {
            const s = document.getElementById('shop');
            s.style.display = s.style.display === 'block' ? 'none' : 'block';
        }

        function buyUpgrade() {
            if (money >= 200) {
                money -= 200;
                maxSpeed += 10;
                document.getElementById('money').innerText = money;
                alert("Motor oppgradert!");
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
